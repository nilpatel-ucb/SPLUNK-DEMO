<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind Rewards — Join the waitlist</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0f1115;color:#eceef2}
  .card{width:min(420px,92vw);background:#171a21;border:1px solid #262b35;border-radius:18px;padding:32px 30px;position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:22px}
  .brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6d8cff,#9b6bff);display:block}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#9aa1ad;margin:0 0 22px;line-height:1.5;font-size:14px}
  label{display:block;font-size:13px;color:#b8bec9;margin:14px 0 6px}
  input{width:100%;height:44px;border-radius:10px;border:1px solid #2e3440;background:#0f1115;color:#eceef2;padding:0 12px;font:inherit;font-size:15px}
  input:focus{outline:none;border-color:#6d8cff}
  button{margin-top:22px;width:100%;height:46px;border:0;border-radius:11px;background:#6d8cff;color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  button:hover{background:#7d99ff}
  .done{text-align:center;display:none}
  .done .big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px;background:linear-gradient(90deg,#ffd166,#ff6b9a,#6d8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card.ok form{display:none}.card.ok .done{display:block;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:3}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main class="card" id="card">
  <div class="brand"><i></i>Northwind Rewards</div>
  <form id="signup" novalidate>
    <h1>Join the waitlist</h1>
    <p>Get early access to rewards on every trip.</p>
    <label for="name">Full name</label>
    <input id="name" name="name" autocomplete="name" placeholder="Jordan Lee">
    <label for="email-address">Email</label>
    <input id="email-address" name="email" type="email" autocomplete="email" placeholder="jordan@example.com">
    <button type="submit" id="submit-btn">Submit</button>
  </form>
  <div class="done" role="status">
    <div class="big">Hooray! 🎉</div>
    <p id="done-msg">You're on the list.</p>
  </div>
</main>
<script>
  const form = document.getElementById("signup");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    if (!email.includes("@")) {
      document.getElementById("email-address").focus();
      return;
    }
    document.getElementById("done-msg").textContent =
      "You're on the list" + (name ? ", " + name.split(" ")[0] : "") + ". We'll email " + email + ".";
    document.getElementById("card").classList.add("ok");
    celebrate();
  });

  function celebrate() {
    const c = document.getElementById("confetti"), x = c.getContext("2d");
    const resize = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; };
    resize(); addEventListener("resize", resize);
    const colors = ["#ffd166", "#ff6b9a", "#6d8cff", "#5fd38a", "#9b6bff", "#4fc3b0"];
    const bits = [];
    const burst = (ox, oy, n) => {
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, v = 9 + Math.random() * 11;
        bits.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6 + Math.random() * 6, h: 9 + Math.random() * 8,
          r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35, c: colors[(Math.random() * colors.length) | 0], life: 0 });
      }
    };
    const W = () => c.width / devicePixelRatio, H = () => c.height / devicePixelRatio;
    burst(W() * 0.5, H() * 0.55, 160);
    setTimeout(() => burst(W() * 0.2, H() * 0.75, 110), 250);
    setTimeout(() => burst(W() * 0.8, H() * 0.75, 110), 450);
    (function tick() {
      x.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      x.clearRect(0, 0, W(), H());
      for (const b of bits) {
        b.vy += 0.32; b.vx *= 0.99; b.vy *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
        x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c;
        x.globalAlpha = Math.max(0, 1 - b.life / 260);
        x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.life / 8))); x.restore();
      }
      for (let i = bits.length - 1; i >= 0; i--) if (bits[i].y > H() + 40 || bits[i].life > 260) bits.splice(i, 1);
      if (bits.length) requestAnimationFrame(tick); else x.clearRect(0, 0, W(), H());
    })();
  }
</script>
</body>
</html>
